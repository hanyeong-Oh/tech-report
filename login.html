<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>로그인 · 기술 레포트</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="top"><span class="brand">기술 레포트</span></header>
<main class="wrap narrow">
  <h1 class="pagetitle">로그인</h1>
  <p id="err" class="err" hidden>비밀번호가 맞지 않습니다.</p>
  <form method="post" action="/login" class="form">
    <label>비밀번호<input name="pw" type="password" autocomplete="current-password" required autofocus></label>
    <input type="hidden" name="next" id="next">
    <button type="submit">들어가기</button>
  </form>
  <p class="muted small">비밀번호는 담당자에게 물어보세요.</p>
</main>
<script>
var p = new URLSearchParams(location.search);
document.getElementById('next').value = p.get('next') || '/';
if (p.get('e')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
